name: minha-rede-social

services:
  frontend:
    build:
      context: ./frontend

    container_name: projeto_frontend

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      API_INTERNAL_URL: http://backend:8000
      VIBRA_API_ORIGIN: http://backend:8000

    depends_on:
      - backend

  backend:
    build:
      context: ./backend

    container_name: projeto_backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL}
      NODE_API_URL: http://node-api:4173

    depends_on:
      - node-api

  node-api:
    build:
      context: ./backend/node-api

    container_name: projeto_node_api

    ports:
      - "4173:4173"

    volumes:
      - node_api_data:/app/data

    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "4173"
      VIBRA_DATA_DIR: /app/data
      VIBRA_SEED_DEMO: ${VIBRA_SEED_DEMO:-0}
      VIBRA_DEMO_PASSWORD: ${VIBRA_DEMO_PASSWORD:-}
      IDENTITY_PROVIDER: ${IDENTITY_PROVIDER:-}
      IDENTITY_WEBHOOK_SECRET: ${IDENTITY_WEBHOOK_SECRET:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}

  postgres:
    image: postgres:18.6-bookworm
    container_name: projeto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${VIBRA_DB_NAME:-vibra}
      POSTGRES_USER: ${VIBRA_DB_USER:-vibra}
      POSTGRES_PASSWORD: ${VIBRA_DB_PASSWORD:-vibra_dev_password}
      TZ: ${VIBRA_TZ:-UTC}
      PGTZ: ${VIBRA_TZ:-UTC}
    ports:
      - "${VIBRA_DB_PORT:-5432}:5432"
    volumes:
      - vibra_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 256mb

volumes:
  frontend_node_modules:
  node_api_data:
  vibra_postgres_data:
    name: vibra_postgres_data
