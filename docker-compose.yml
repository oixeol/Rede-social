# Infraestrutura local do Vibra.
# PostgreSQL 18.6 em contêiner, com volume nomeado e healthcheck.
#
# Uso:
#   docker compose up -d postgres
#   docker compose ps
#   docker compose down          (mantém o volume)
#   docker compose down -v       (remove também o volume)

name: vibra

services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: vibra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${VIBRA_DB_NAME:-vibra}
      POSTGRES_USER: ${VIBRA_DB_USER:-vibra}
      POSTGRES_PASSWORD: ${VIBRA_DB_PASSWORD:-vibra_dev_password}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
      TZ: ${VIBRA_TZ:-UTC}
      PGTZ: ${VIBRA_TZ:-UTC}
    ports:
      - '${VIBRA_DB_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18+ usa /var/lib/postgresql/<major> como PGDATA.
      # O mount deve ser no diretório pai para permitir upgrades com pg_upgrade.
      - vibra_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 256mb

volumes:
  vibra_postgres_data:
    name: vibra_postgres_data
